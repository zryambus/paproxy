[package]
name = "paproxy"
version = "0.7.0"
edition = "2024"
authors = ["Ilya Volchenkov <lzhepelmen@gmail.com>"]
repository = "https://github.com/zryambus/paproxy"
license-file = "LICENSE"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["full"] }
hyper = { version = "1.12.0", features = ["full"] }
hyper-util = "0.1.21"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
hyper-rustls = "0.27.10"
rustls = { version = "0.23.46", features = ["tls12"] }
rustls-native-certs = "0.8.4"
http-body-util = "0.1.5"
tokio-tungstenite = { version = "0.30.0", features = ["__rustls-tls"] }
config = { version = "0.15.27", features = ["yaml"] }
serde_derive = "1.0.229"
serde = "1.0.229"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
http = "1.5.0"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dashmap = "6.2.1"
futures = "0.3.34"
human_bytes = "0.4.3"
ratatui = { version = "0.30.2", features = ["serde"] }
tui-logger = { version = "0.18.3", features = ["tracing-support"] }
tokio-util = "0.7.20"
signal-hook = "0.4.6"
cookie = "0.18.2"
logroller = { version = "0.1.12", features = ["tracing"] }
tracing-appender = "0.2.5"
simple-file-rotation = "0.3.4"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }

# GUI, enabled by the "gui" feature
gpui-kit = { version = "0.9.0", optional = true }
chrono = { version = "0.4.45", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"], optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }

[features]
gui = ["dep:gpui-kit", "dep:chrono", "dep:windows-sys", "dep:image"]

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[[bin]]
name = "paproxy"
path = "src/main.rs"
