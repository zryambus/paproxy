[package]
name = "paproxy"
version = "0.5.1"
edition = "2024"
authors = ["Ilya Volchenkov <lzhepelmen@gmail.com>"]
repository = "https://github.com/zryambus/paproxy"
license-file = "LICENSE"

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
axum-extra = { version = "=0.12.6", features = ["cookie"] }
anyhow = "=1.0.104"
tokio = { version = "=1.53.1", features = ["full"] }
hyper = { version = "=1.11.0", features = ["full"] }
hyper-util = "=0.1.20"
tower-http = { version = "=0.7.0", features = ["fs", "cors", "trace"] }
hyper-rustls = "=0.27.9"
rustls = { version = "=0.23.43", features = ["tls12"] }
http-body-util = "=0.1.4"
bytes = "=1.12.1"
tokio-tungstenite = { version = "=0.30.0", features = ["__rustls-tls"] }
url = "=2.5.8"
futures-util = "=0.3.33"
config = { version = "=0.15.25", features = ["yaml"] }
serde_derive = "=1.0.229"
serde = "=1.0.229"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
http = "=1.5.0"
clap = { version = "=4.6.6", features = ["derive"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
dashmap = "=6.2.1"
futures = "=0.3.33"
human_bytes = "=0.4.3"
ratatui = { version = "=0.30.2", features = ["serde"] }
tui-logger = { version = "=0.18.3", features = ["tracing-support"] }
tokio-util = "=0.7.19"
signal-hook = "=0.4.4"
cookie = "=0.18.1"
logroller = { version = "=0.1.12", features = ["tracing"] }
tracing-appender = "=0.2.5"
simple-file-rotation = "=0.3.4"
axum-server = { version = "=0.8.0", features = ["tls-rustls"] }

[[bin]]
name = "paproxy"
path = "src/main.rs"
